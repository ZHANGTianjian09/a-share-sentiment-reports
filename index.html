<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="财经博主公开评论情绪分析报告归档">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>每日市场情绪报告｜财经情绪观察</title>
  <style>
    :root{--paper:#f6f3ec;--surface:#fffdf8;--ink:#172239;--muted:#687083;--line:#d9d6ce;--blue:#2d66d8;--blue-soft:#e9f0ff;--green:#2e9a66}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 12% 4%,rgba(45,102,216,.08),transparent 24rem),var(--paper);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}.site-header{border-bottom:1px solid rgba(23,34,57,.12);background:rgba(246,243,236,.86);backdrop-filter:blur(14px)}.header-inner,.hero,.archive,footer{width:min(1080px,calc(100% - 40px));margin:0 auto}.header-inner{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{display:inline-flex;align-items:center;gap:11px;font-size:15px;font-weight:700;letter-spacing:.04em}.brand-mark{display:grid;width:31px;height:31px;place-items:center;border-radius:9px;background:var(--ink);color:#fff;font-family:Georgia,serif;font-size:16px}.header-note{color:var(--muted);font-size:13px}.hero{padding:90px 0 66px}.eyebrow,.section-kicker{margin:0 0 15px;color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.18em}h1{max-width:720px;margin:0;font-family:"Songti SC","STSong",serif;font-size:clamp(44px,7vw,74px);font-weight:700;letter-spacing:-.045em;line-height:1.08}.hero-copy{max-width:680px;margin:26px 0 0;color:#4e586c;font-size:17px;line-height:1.9}.hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:30px}.method-link{display:inline-flex;align-items:center;gap:9px;padding:10px 15px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;transition:transform .18s ease,background .18s ease}.method-link:hover,.method-link:focus-visible{background:var(--blue);outline:none;transform:translateY(-1px)}.update-status{display:inline-flex;align-items:center;gap:9px;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(255,253,248,.7);color:var(--muted);font-size:12px}.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(46,154,102,.12)}.archive{padding:0 0 90px}.archive-heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:22px}.archive-heading h2{margin:0;font-size:27px;letter-spacing:-.03em}.archive-heading>p{margin:0 0 3px;color:var(--muted);font-size:12px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}.filter{padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(255,253,248,.65);color:var(--muted);font:inherit;font-size:12px;cursor:pointer}.filter:hover,.filter:focus-visible{border-color:var(--blue);outline:none}.filter.active{border-color:var(--blue);background:var(--blue);color:#fff}.report-list{border-top:1px solid var(--ink)}.report-day{display:grid;grid-template-columns:210px 1fr;gap:40px;padding:35px 0;border-bottom:1px solid var(--line)}.date-column{display:flex;flex-direction:column;align-items:flex-start}.date-column time{font-family:"Songti SC","STSong",serif;font-size:22px;font-weight:700}.date-column>span{margin-top:7px;color:var(--muted);font-size:12px}.date-column .report-count{margin-top:19px;padding:5px 9px;border-radius:6px;background:var(--blue-soft);color:var(--blue);font-weight:700}.report-links{display:grid;gap:12px}.report-link{display:grid;grid-template-columns:74px 1fr 30px;align-items:center;min-height:91px;padding:16px 20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 7px 25px rgba(23,34,57,.035);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.report-link:hover,.report-link:focus-visible{transform:translateY(-2px);border-color:rgba(45,102,216,.7);box-shadow:0 12px 30px rgba(23,34,57,.08);outline:none}.report-time{font-family:Georgia,serif;color:var(--blue);font-size:17px;font-variant-numeric:tabular-nums}.report-copy{display:flex;min-width:0;flex-direction:column;gap:7px}.report-copy strong{font-size:16px}.report-copy small{overflow:hidden;color:var(--muted);font-size:12px;line-height:1.5;text-overflow:ellipsis;white-space:nowrap}.open-icon{color:var(--muted);font-size:20px;text-align:right;transition:color .18s ease,transform .18s ease}.report-link:hover .open-icon,.report-link:focus-visible .open-icon{color:var(--blue);transform:translate(2px,-2px)}.empty{padding:48px 0;border-bottom:1px solid var(--line);color:var(--muted);line-height:1.8}.error{color:#a43d3d}footer{padding:30px 0 42px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.7}footer p{margin:3px 0}@media(max-width:680px){.header-inner,.hero,.archive,footer{width:min(100% - 28px,1080px)}.header-inner{height:62px}.header-note{display:none}.hero{padding:66px 0 54px}h1{font-size:43px;letter-spacing:-.06em}.hero-copy{margin-top:21px;font-size:15px;line-height:1.8}.hero-actions{align-items:flex-start;flex-direction:column}.archive-heading{align-items:flex-start;flex-direction:column;gap:9px}.report-day{grid-template-columns:1fr;gap:21px;padding:28px 0}.date-column{position:relative}.date-column .report-count{position:absolute;top:0;right:0;margin:0}.report-link{grid-template-columns:57px 1fr 24px;min-height:86px;padding:14px}.report-time{font-size:15px}.report-copy small{white-space:normal}}
  </style>
</head>
<body>
  <main>
    <section class="hero" id="top"><p class="eyebrow">MARKET SENTIMENT REPORTS</p><h1>每日市场情绪报告</h1><p class="hero-copy">汇总财经博主公开评论区的市场情绪。当前口径在交易日盘前与收盘前各形成一份独立快照。</p><div class="hero-actions"><a class="method-link" href="methodology.html">阅读数据与指标说明 <span aria-hidden="true">→</span></a><div class="update-status"><span class="status-dot" aria-hidden="true"></span><span id="last-updated">正在读取报告归档…</span></div></div></section>
    <section class="archive" aria-labelledby="archive-title"><div class="archive-heading"><div><p class="section-kicker">REPORT ARCHIVE</p><h2 id="archive-title">报告归档</h2></div><p>点击报告即可在新标签页打开 PDF</p></div><nav class="filters" aria-label="报告分类"><button class="filter active" data-category="all">全部</button><button class="filter" data-category="preopen">盘前报告</button><button class="filter" data-category="close">收盘前报告</button><button class="filter" data-category="weekly">周报</button><button class="filter" data-category="misc">专题/其他</button></nav><div class="report-list" id="report-list" aria-live="polite"><p class="empty">正在读取报告…</p></div></section>
  </main>
  <footer><p>本页面仅展示公开评论数据的汇总分析，不构成投资建议。</p><p>如微信内无法预览 PDF，请使用右上角菜单在浏览器中打开。</p><p>Acknowledgement: Zhangtj is supported by Duan Yongping's Fellowship.</p></footer>
  <script>
    const labels={preopen:"盘前报告",close:"收盘前报告",weekly:"周报",misc:"专题/其他报告"};
    const details={preopen:"上一边界至盘前截止的信息窗口",close:"盘前边界至收盘前截止的信息窗口",weekly:"一周市场情绪汇总",misc:"临时或专题分析"};
    const list=document.querySelector("#report-list");const updated=document.querySelector("#last-updated");let reports=[];let active="all";
    const dateText=value=>new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"long",day:"numeric"}).format(new Date(`${value}T00:00:00+08:00`));
    const weekday=value=>new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",weekday:"long"}).format(new Date(`${value}T00:00:00+08:00`));
    const timeText=value=>value?new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(value)):"--:--";
    function render(){const selected=active==="all"?reports:reports.filter(item=>item.category===active);if(!selected.length){list.innerHTML=`<p class="empty">${active==="all"?"目前还没有可查看的报告。":"这个分类暂时没有报告。"}</p>`;return}const groups=Object.groupBy?Object.groupBy(selected,item=>item.report_date):selected.reduce((acc,item)=>((acc[item.report_date]??=[]).push(item),acc),{});list.innerHTML=Object.entries(groups).sort(([a],[b])=>b.localeCompare(a)).map(([day,items])=>`<article class="report-day"><div class="date-column"><time datetime="${day}">${dateText(day)}</time><span>${weekday(day)}</span><span class="report-count">${items.length} 份报告</span></div><div class="report-links">${items.map(item=>`<a class="report-link" href="${encodeURI(item.file)}" target="_blank" rel="noreferrer"><span class="report-time">${timeText(item.published_at)}</span><span class="report-copy"><strong>${item.title}${item.revision>1?`（修订 ${item.revision}）`:""}</strong><small>${details[item.category]??"情绪分析报告"}</small></span><span class="open-icon" aria-hidden="true">↗</span></a>`).join("")}</div></article>`).join("")}
    document.querySelectorAll(".filter").forEach(button=>button.addEventListener("click",()=>{document.querySelectorAll(".filter").forEach(item=>item.classList.remove("active"));button.classList.add("active");active=button.dataset.category;render()}));
    fetch("reports.json",{cache:"no-store"}).then(response=>{if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json()}).then(data=>{reports=Array.isArray(data.reports)?data.reports:[];updated.textContent=reports.length?`最近更新：${new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"long",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(reports[0].published_at))}`:"尚未发布报告";render()}).catch(error=>{updated.textContent="报告清单读取失败";list.innerHTML=`<p class="empty error">暂时无法读取报告清单，请稍后刷新。<br><small>${error.message}</small></p>`});
  </script>
</body>
</html>
